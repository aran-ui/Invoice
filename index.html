<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Invoice & Kwitansi - OFO KOST</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- FORM INPUT -->
        <div class="bg-white p-6 rounded-xl shadow-md space-y-6">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-3">Input Data Pemesanan</h2>
            
            <!-- Data Penyewa & Kamar -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Penyewa</label>
                    <input type="text" id="inpCustomerName" value="Ahmad Subagja" oninput="updatePreview()" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tipe Kamar</label>
                        <select id="inpRoomType" onchange="updatePreview()" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
                            <option value="Kamar Standard">Kamar Standard</option>
                            <option value="Kamar Deluxe">Kamar Deluxe</option>
                            <option value="Kamar VIP">Kamar VIP</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Harga Kamar (Rp)</label>
                        <input type="number" id="inpRoomPrice" value="1500000" oninput="updatePreview()" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tanggal Check-In</label>
                        <input type="date" id="inpCheckIn" onchange="updatePreview()" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tanggal Check-Out</label>
                        <input type="date" id="inpCheckOut" onchange="updatePreview()" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Layanan Tambahan (Single Select)</label>
                    <select id="inpExtraService" onchange="updatePreview()" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
                        <option value="Tanpa Extra Service" data-price="0">Tanpa Extra Service</option>
                        <option value="Laundry Mingguan" data-price="100000">Laundry (Rp 100.000)</option>
                        <option value="Pembersihan Kamar" data-price="50000">Pembersihan (Rp 50.000)</option>
                        <option value="Sewa Parkir Mobil" data-price="150000">Parkir Mobil (Rp 150.000)</option>
                    </select>
                </div>
            </div>

            <!-- Tombol Cetak PDF -->
            <button onclick="downloadPDF()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 rounded-lg transition shadow">
                <i class="fa-solid fa-file-pdf mr-2"></i> Download Invoice PDF
            </button>
        </div>

        <!-- PRATINJAU INVOICE -->
        <div class="bg-gray-200 p-4 rounded-xl flex justify-center items-start">
            <div id="invoice-preview" class="bg-white w-full max-w-[210mm] p-8 rounded shadow-lg text-gray-800 space-y-6">
                <!-- Header -->
                <div class="flex justify-between items-center border-b pb-4">
                    <div>
                        <h1 class="text-2xl font-black text-gray-900">OFO KOST</h1>
                        <p class="text-xs text-gray-500">Hunian Nyaman & Terjangkau</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-gray-400 block">INVOICE</span>
                        <span class="text-sm font-bold text-gray-700" id="lblInvoiceNum">#INV-202610-001</span>
                    </div>
                </div>

                <!-- Metadata -->
                <div class="grid grid-cols-2 text-sm gap-4">
                    <div>
                        <span class="text-gray-500 block text-xs">Penyewa:</span>
                        <strong id="lblCustomerName" class="text-gray-800">Ahmad Subagja</strong>
                    </div>
                    <div>
                        <span class="text-gray-500 block text-xs">Periode Sewa:</span>
                        <span id="lblPeriod" class="text-gray-800 font-medium">-</span>
                    </div>
                </div>

                <!-- Rincian Tabel -->
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="border-b text-gray-500 text-xs uppercase">
                            <th class="py-2">Deskripsi / Layanan</th>
                            <th class="py-2 text-right">Biaya</th>
                        </tr>
                    </thead>
                    <tbody id="invoice-items-body" class="divide-y">
                        <!-- Item Kamar dan Service dirender oleh JS -->
                    </tbody>
                    <tfoot>
                        <tr class="border-t-2 border-gray-800 font-bold text-base">
                            <td class="pt-4 text-gray-900">Total Pembayaran</td>
                            <td class="pt-4 text-right text-gray-900" id="lblGrandTotal">Rp 0</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="text-xs text-gray-400 border-t pt-4 text-center">
                    Terima kasih telah memilih OFO KOST sebagai tempat tinggal Anda.
                </div>
            </div>
        </div>

    </div>

    <script>
        function updatePreview() {
            // Update Data Teks
            document.getElementById('lblCustomerName').innerText = document.getElementById('inpCustomerName').value || '-';
            
            const checkIn = document.getElementById('inpCheckIn').value;
            const checkOut = document.getElementById('inpCheckOut').value;
            document.getElementById('lblPeriod').innerText = (checkIn && checkOut) ? `${checkIn} s/d ${checkOut}` : '-';

            // Reset Table
            const tableBody = document.getElementById('invoice-items-body');
            tableBody.innerHTML = '';

            let total = 0;

            // 1. Biaya Utama Kamar
            const roomType = document.getElementById('inpRoomType').value;
            const roomPrice = parseFloat(document.getElementById('inpRoomPrice').value) || 0;
            total += roomPrice;

            tableBody.insertAdjacentHTML('beforeend', `
                <tr>
                    <td class="py-3 font-medium text-gray-800">${roomType}</td>
                    <td class="py-3 text-right text-gray-800">Rp ${roomPrice.toLocaleString('id-ID')}</td>
                </tr>
            `);

            // 2. Extra Service Single Option
            const serviceSelect = document.getElementById('inpExtraService');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const serviceName = selectedOption.value;
            const servicePrice = parseFloat(selectedOption.getAttribute('data-price')) || 0;

            if (servicePrice > 0) {
                total += servicePrice;
                tableBody.insertAdjacentHTML('beforeend', `
                    <tr class="text-gray-600">
                        <td class="py-2 pl-4 text-xs">+ ${serviceName}</td>
                        <td class="py-2 text-right text-xs">Rp ${servicePrice.toLocaleString('id-ID')}</td>
                    </tr>
                `);
            }

            // Update Total
            document.getElementById('lblGrandTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function initDates() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            document.getElementById('inpCheckIn').value = today.toISOString().split('T')[0];
            document.getElementById('inpCheckOut').value = tomorrow.toISOString().split('T')[0];
        }

        function downloadPDF() {
            const element = document.getElementById('invoice-preview');
            const opt = {
                margin: 5,
                filename: `Invoice_${document.getElementById('inpCustomerName').value || 'Penyewa'}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        window.onload = () => {
            initDates();
            updatePreview();
        };
    </script>
</body>
</html>
